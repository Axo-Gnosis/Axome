[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-crates/axome-protocol",
  "src-crates/axome-core",
  "src-crates/axome-browser",
  "src-crates/axome-memory",
  "src-crates/axome-remote",
  "src-crates/axome-server",
]
default-members = ["src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
jsonc-parser = { version = "0.32", features = ["serde", "cst"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
axo = { git = "https://git.ryot.foo/toph/axo.git", rev = "c1b060a5e22e64e84313dd68b99e7eb16dcc2999" }
axo-agent = { git = "https://git.ryot.foo/toph/axo.git", rev = "c1b060a5e22e64e84313dd68b99e7eb16dcc2999" }
axo-ai = { git = "https://git.ryot.foo/toph/axo.git", rev = "c1b060a5e22e64e84313dd68b99e7eb16dcc2999" }
axo-extensions = { git = "https://git.ryot.foo/toph/axo.git", rev = "c1b060a5e22e64e84313dd68b99e7eb16dcc2999" }
axo-codex = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "fa26781443c3a7a65354191b0475aed25e42eac9" }
axo-anthropic-auth = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "fa26781443c3a7a65354191b0475aed25e42eac9" }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
playwright-rs = { version = "0.21", default-features = false, features = ["ring", "native-tls"] }
