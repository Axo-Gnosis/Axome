[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-crates/axome-protocol",
  "src-crates/axome-core",
  "src-crates/axome-browser",
  "src-crates/axome-memory",
  "src-crates/axome-remote",
  "src-crates/axome-server",
]
default-members = ["src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
jsonc-parser = { version = "0.32", features = ["serde", "cst"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
axo = { git = "https://git.ryot.foo/toph/axo.git", rev = "6018ae73f20272600347320e1331949536bd6ece" }
axo-agent = { git = "https://git.ryot.foo/toph/axo.git", rev = "6018ae73f20272600347320e1331949536bd6ece" }
axo-ai = { git = "https://git.ryot.foo/toph/axo.git", rev = "6018ae73f20272600347320e1331949536bd6ece" }
axo-extensions = { git = "https://git.ryot.foo/toph/axo.git", rev = "6018ae73f20272600347320e1331949536bd6ece" }
axo-codex = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "335eb19be47489ae12e86f45d7f2f39df07cd22b" }
axo-anthropic-auth = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "335eb19be47489ae12e86f45d7f2f39df07cd22b" }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
playwright-rs = { version = "0.21", default-features = false, features = ["ring", "native-tls"] }
