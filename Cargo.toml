[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-crates/axome-protocol",
  "src-crates/axome-core",
  "src-crates/axome-browser",
  "src-crates/axome-memory",
  "src-crates/axome-remote",
  "src-crates/axome-server",
]
default-members = ["src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["indexmap2"] }
indexmap = { version = "2", features = ["serde"] }
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
jsonschema = { version = "0.59.0", default-features = false }
anyhow = "1"
base64 = "0.23.1"
sha2 = "0.11.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
parking_lot = "0.12"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
axo = { git = "https://git.ryot.foo/toph/axo.git", rev = "d740a348741d4ae42df6c6bfe4d616103a0a58d9" }
axo-agent = { git = "https://git.ryot.foo/toph/axo.git", rev = "d740a348741d4ae42df6c6bfe4d616103a0a58d9" }
axo-ai = { git = "https://git.ryot.foo/toph/axo.git", rev = "d740a348741d4ae42df6c6bfe4d616103a0a58d9" }
axo-extensions = { git = "https://git.ryot.foo/toph/axo.git", rev = "d740a348741d4ae42df6c6bfe4d616103a0a58d9" }
axo-codex = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "79a33a90a9617dbc3fc03b067fc36a96f3c49d1a" }
axo-anthropic-auth = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "79a33a90a9617dbc3fc03b067fc36a96f3c49d1a" }
axo-predict = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "79a33a90a9617dbc3fc03b067fc36a96f3c49d1a" }
axo-models = { git = "https://git.ryot.foo/toph/Axo-Extras.git", rev = "79a33a90a9617dbc3fc03b067fc36a96f3c49d1a" }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
playwright-rs = { version = "0.21", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.dev.package.candle-core]
opt-level = 2

[profile.dev.package.candle-nn]
opt-level = 2

[profile.dev.package.candle-transformers]
opt-level = 2

[profile.dev.package.gemm]
opt-level = 2

[profile.dev.package.tokenizers]
opt-level = 2

[profile.dev.package.ring]
opt-level = 2

[profile.dev.package.libsqlite3-sys]
opt-level = 2

# candle 0.11.1 re-reads /proc/cpuinfo on every CPU matmul when RAYON_NUM_THREADS is unset (~3-4x slower);
# fork = 0.11.1 + https://github.com/huggingface/candle/pull/4067.
# ponytail: drop once a candle release includes the fix.
[patch.crates-io]
candle-core = { git = "https://git.ryot.foo/toph/candle.git", rev = "e2af193fe630f2d86c39fd6f5c9f993d0aa60cdf" }
