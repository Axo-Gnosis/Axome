[package]
name = "axome-core"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axome-protocol = { path = "../axome-protocol" }
axome-browser = { path = "../axome-browser" }
axome-memory = { path = "../axome-memory" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
jsonc-parser.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["process"] }
rusqlite.workspace = true
tracing.workspace = true
parking_lot.workspace = true
axo.workspace = true
axo-agent.workspace = true
axo-ai.workspace = true
axo-extensions.workspace = true
axo-codex.workspace = true
axo-anthropic-auth.workspace = true
axo-predict.workspace = true
axo-models.workspace = true
async-trait.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures-util.workspace = true
libc = "0.2"
notify = "6"
ignore = "0.4"
globset = "0.4"
thiserror = "2"
trash = "5"
portable-pty = "0.9"
refinery = { version = "0.8", features = ["rusqlite"] }
which = "8"
sha2 = "0.10"
regex = "1"
base64 = "0.22"
jsonschema = { version = "0.55.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
url = "2"
tempfile = "3"
html5ever = "0.38"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
axo-ai = { workspace = true, features = ["testing"] }
